
<main class="page">
  <h1>Sweet Crumbs team</h1>

  <p>
    Selected: {{ selectedMember?.name ?? 'None' }}
  </p>

  <p>
    @if (favoriteMember) {
      Favorite: {{ favoriteMember.name }}
    } @else {
      Favorite: none yet
    }
  </p>

  <div class="actions">
    <button type="button" (click)="changeName()">
      Change name
    </button>

    <button type="button" (click)="changeJob()">
      Change job
    </button>
  </div>

  @if (message) {
  <p class="error-message">{{ message }}</p>
}

  <section class="team-grid">
    @for (member of team; track member.id) {
      <app-team-card
        [person]="member"
        [isSelected]="selectedId === member.id"
        [isFavorite]="favoriteId === member.id"
        (selected)="selectMember($event)"
        (favorite)="setFavorite($event)"
      />
    } @empty {
      <p>No team members found.</p>
    }
  </section>
</main>
