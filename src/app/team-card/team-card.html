
<app-card-shell
  [highlightColor]="person.job === 'Customer Support' ? '#d9f0ff' : '#fff3cd'"
  (click)="selectCard()"
>
  <div card-header>
    <h2 class="name">{{ person.name }}</h2>

    @switch (person.job) {
      @case ('Founder and Sales Head') {
        <span class="job-badge">Founder</span>
      }
      @case ('Sales Rep') {
        <span class="job-badge">Sales</span>
      }
      @case ('Customer Support') {
        <span class="job-badge">Support</span>
      }
      @default {
        <span class="job-badge">Team</span>
      }
    }
  </div>

  <div card-body>
    <ng-template #detailRow let-label="label" let-value="value">
      <p><strong>{{ label }}:</strong> {{ value }}</p>
    </ng-template>

    <ng-container
      [ngTemplateOutlet]="detailRow"
      [ngTemplateOutletContext]="{
        label: 'Job',
        value: person.job
      }"
    ></ng-container>

    <ng-container
      [ngTemplateOutlet]="detailRow"
      [ngTemplateOutletContext]="{
        label: 'Covers',
        value: person.covers
      }"
    ></ng-container>

    @if (isSelected) {
      <p class="selected-message">Currently selected</p>
    }
  </div>

  <div card-footer>
    <button type="button" (click)="markFavorite($event)">
      {{ isFavorite ? 'Favorited' : 'Mark as favorite' }}
    </button>
  </div>
</app-card-shell>
