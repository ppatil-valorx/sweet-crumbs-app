<div
  class="team-card"
  [class.selected]="isSelected"
  (click)="selectCard()"
>
  <h2 class="name">{{ person.name }}</h2>


@switch (person.job) {
  @case ('Founder and Sales Head') {
    <span class="job-badge">Founder</span>
  }
  @case ('Sales Rep') {
    <span class="job-badge">Sales</span>
  }
  @case ('Customer Support') {
    <span class="job-badge">Support</span>
  }
  @default {
    <span class="job-badge">Team</span>
  }
}


  <p>
    <strong>Job:</strong> {{ person.job }}
  </p>

  <p>
    <strong>Covers:</strong> {{ person.covers }}
  </p>

  <button
    type="button"
    (click)="markFavorite($event)"
  >
    {{ isFavorite ? 'Favorited' : 'Mark as favorite' }}
  </button>
</div>
